name: Build Windows 2022 (Self-Contained)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    strategy:
      matrix:
        rid: 
          - win-x64
          - win-x86
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore GraniteTextureReader.sln
    
    - name: Build Library (Release)
      run: dotnet build GraniteTextureReader/GraniteLib.csproj -c Release -f net8.0
    
    - name: Publish CLI Self-Contained (${{ matrix.rid }})
      run: |
        dotnet publish GraniteTextureReader.CLI/GraniteTextureReader.CLI.csproj `
          -c Release `
          -f net8.0 `
          --self-contained `
          -r ${{ matrix.rid }} `
          -o ./publish/${{ matrix.rid }}
    
    - name: Create Archive
      run: |
        $rid = "${{ matrix.rid }}"
        $zipName = "GraniteTextureReader-$rid-${{ github.run_number }}.zip"
        Compress-Archive -Path "./publish/$rid/*" -DestinationPath "./artifacts/$zipName"
      shell: pwsh
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GraniteTextureReader-${{ matrix.rid }}
        path: artifacts/
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
